<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente IA · Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: rgba(20, 26, 43, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6e9f2;
      --muted: #8b93a7;
      --accent-1: #7c5cff;
      --accent-2: #00d4ff;
      --bubble-ai: #1b2236;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado con manchas de color */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      z-index: -1;
      animation: float 14s ease-in-out infinite alternate;
    }

    .blob.one {
      width: 420px;
      height: 420px;
      background: var(--accent-1);
      top: -120px;
      left: -100px;
    }

    .blob.two {
      width: 380px;
      height: 380px;
      background: var(--accent-2);
      bottom: -140px;
      right: -80px;
      animation-delay: -6s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(60px, 40px) scale(1.15);
      }
    }

    /* Contenedor principal */
    .chat-container {
      width: min(760px, 94vw);
      height: min(820px, 92vh);
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Encabezado */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .clear-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      transition: all .2s;
    }

    .clear-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, .25);
    }

    /* Área de mensajes */
    .chat-box {
      flex: 1;
      padding: 24px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 3px;
    }

    /* Pantalla de bienvenida */
    .welcome {
      margin: auto;
      text-align: center;
      max-width: 460px;
      animation: fadeUp .5s ease;
    }

    .welcome .avatar {
      width: 68px;
      height: 68px;
      font-size: 34px;
      border-radius: 20px;
      margin: 0 auto 18px;
    }

    .welcome h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, #b9c2ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chip {
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font: inherit;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
      transition: all .2s;
    }

    .chip:hover {
      background: rgba(124, 92, 255, .14);
      border-color: rgba(124, 92, 255, .5);
      transform: translateY(-2px);
    }

    /* Burbujas */
    .row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp .3s ease;
    }

    .row.user {
      flex-direction: row-reverse;
    }

    .row .mini-avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 15px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }

    .row.user .mini-avatar {
      background: #2a3350;
    }

    .message {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 75%;
      line-height: 1.55;
      font-size: 14.5px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      background: linear-gradient(135deg, var(--accent-1), #5b8cff);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message.assistant {
      background: var(--bubble-ai);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .message.error {
      border-color: rgba(239, 68, 68, .5);
      color: #fca5a5;
    }

    /* Indicador "escribiendo..." */
    .typing {
      display: flex;
      gap: 5px;
      padding: 16px 18px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .4;
      }

      30% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Área de entrada */
    .input-area {
      padding: 16px 22px 20px;
      border-top: 1px solid var(--border);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 6px 6px 18px;
      transition: border-color .2s, box-shadow .2s;
    }

    .input-wrapper:focus-within {
      border-color: rgba(124, 92, 255, .6);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, .15);
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 14.5px;
      padding: 10px 0;
    }

    .input-wrapper input::placeholder {
      color: var(--muted);
    }

    #sendBtn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .15s, opacity .2s;
    }

    #sendBtn:hover {
      transform: scale(1.06);
    }

    #sendBtn:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      text-align: center;
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 10px;
    }

    @media (max-width: 560px) {
      .chat-container {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>
  <div class="blob one"></div>
  <div class="blob two"></div>

  <div class="chat-container">
    <header class="chat-header">
      <div></div>
      <div class="header-info">
        <h1>Agente IA</h1>
        <div class="status">En línea · gpt-4o-mini</div>
      </div>
      <button class="clear-btn" onclick="clearChat()" title="Nueva conversación">↺ Nuevo chat</button>
    </header>

    <div id="chatBox" class="chat-box">
      <div id="welcome" class="welcome">
        <div></div>
        <h2>¡Hola! ¿En qué te ayudo?</h2>
        <p>Soy tu asistente de inteligencia artificial. Pregúntame lo que quieras o elige una sugerencia para comenzar.
        </p>
        <div class="suggestions">
          <button class="chip" onclick="useSuggestion(this)">💡 Explícame qué es una API REST</button>
          <button class="chip" onclick="useSuggestion(this)">🧑‍💻 Dame un ejemplo de código en JavaScript</button>
          <button class="chip" onclick="useSuggestion(this)">📚 Ayúdame a estudiar para un examen</button>
          <button class="chip" onclick="useSuggestion(this)">✍️ Redacta un correo formal</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)"
          autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()" title="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="hint">Presiona Enter para enviar · Las respuestas pueden contener errores</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
