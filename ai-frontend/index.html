<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente IA - Sakila</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e5ea;
      --text: #1f2937;
      --muted: #6b7280;
      --user-bg: #2563eb;
      --assistant-bg: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      max-height: 780px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background-color: var(--surface);
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .status {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .clear-btn {
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .clear-btn:hover {
      background-color: var(--assistant-bg);
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto;
      max-width: 520px;
      text-align: center;
    }

    .welcome h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chip {
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 8px;
      font: inherit;
      font-size: 13.5px;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
    }

    .chip:hover {
      background-color: var(--assistant-bg);
      border-color: #cbd5e1;
    }

    .row {
      display: flex;
    }

    .row.user {
      justify-content: flex-end;
    }

    .row.assistant {
      justify-content: flex-start;
    }

    .message {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 78%;
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      background-color: var(--user-bg);
      color: #ffffff;
    }

    .message.assistant {
      background-color: var(--assistant-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .message.error {
      background-color: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .input-area {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background-color: var(--surface);
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    .input-wrapper input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background-color: var(--surface);
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--user-bg);
    }

    .input-wrapper input::placeholder {
      color: var(--muted);
    }

    #sendBtn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background-color: var(--user-bg);
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    #sendBtn:hover {
      background-color: #1d4ed8;
    }

    #sendBtn:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }

    @media (max-width: 560px) {
      body {
        padding: 0;
      }
      .chat-container {
        height: 100vh;
        max-height: none;
        border-radius: 0;
        border: none;
      }
      .message {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-info">
        <h1>Agente IA - Sakila</h1>
        <div class="status">Conectado a base de datos MySQL</div>
      </div>
      <button class="clear-btn" onclick="clearChat()">Limpiar chat</button>
    </header>

    <div id="chatBox" class="chat-box">
      <div id="welcome" class="welcome">
        <h2>Consulta la base de datos Sakila</h2>
        <p>Selecciona una pregunta o escribe tu propia consulta para analizar la información de la tienda.</p>
        <div class="suggestions">
          <button class="chip" onclick="useSuggestion(this)">Recomiéndame 3 películas de acción que sean largas (más de 2 horas) pero que la gente alquile muy seguido en la tienda.</button>
          <button class="chip" onclick="useSuggestion(this)">¿Qué clientes crees que están a punto de dejar el servicio porque llevan mucho tiempo sin alquilar ninguna película?</button>
          <button class="chip" onclick="useSuggestion(this)">Hazme un análisis rápido de qué día de la semana hay más movimiento en las tiendas y cuánto dinero promedio se recauda en esos días.</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)" autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
